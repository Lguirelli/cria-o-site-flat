</div><script>window.addEventListener('load',()=>{const anchor="";if(anchor)document.getElementById(anchor)?.scrollIntoView()});const links=[];for(const l of links){const scope=[...document.querySelectorAll('[data-block-instance]')].find(x=>x.dataset.blockInstance===l.block);const node=scope&&[...scope.querySelectorAll('[data-node]')].find(x=>x.dataset.node===l.node);if(node){node.dataset.nav=l.file;node.classList.add('nav-hotspot');node.dataset.toPage=l.toPage;node.dataset.targetAnchor=l.targetAnchor||'';if(node.tagName==='A')node.href=l.file;else{node.setAttribute('role','link');node.setAttribute('tabindex','0');node.style.cursor='pointer';node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();node.click()}})}}}document.addEventListener('click',e=>{const el=e.target.closest('[data-nav]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();location.href=el.dataset.nav;},true);</script><script src="runtime.js"></script></body></html>
