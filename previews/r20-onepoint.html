<div class="nr-theme" data-block-instance="r20-onepoint-numbers"><section class="nr-section nr-onepoint nr-layout-triple" id="onepoint-numbers" data-node="n1"><div class="nr-inner" data-node="n2"><div class="nr-character" data-node="n3"><div data-node="node-3"><p data-node="n4">Criativo</p><p data-node="n5">Visão</p><p data-node="n6">Projeto</p></div><figure class="nr-media " style="aspect-ratio:229/248" data-node="n7"><img src="assets/references-20261020/onepoint.png" alt="Escultura verde estriada" loading="lazy" data-reference-crop="true" style="position:absolute;width:321.39738%;height:395.56452%;max-width:none;left:-94.75983%;top:-262.09677%" data-node="n8"></figure><div data-node="node-9"><h2 data-node="n9">Projetos em números</h2><div class="nr-stats" data-node="n10"><article data-node="node-12"><strong data-node="n11">457+</strong><p data-node="n12">Projetos</p></article><article data-node="node-15"><strong data-node="n13">47+</strong><p data-node="n14">Colaborações</p></article></div></div></div></div></section></div><script>window.addEventListener('load',()=>{const anchor="";if(anchor)document.getElementById(anchor)?.scrollIntoView()});const links=[];for(const l of links){const scope=[...document.querySelectorAll('[data-block-instance]')].find(x=>x.dataset.blockInstance===l.block);const node=scope&&[...scope.querySelectorAll('[data-node]')].find(x=>x.dataset.node===l.node);if(node){node.dataset.nav=l.file;node.dataset.toPage=l.toPage;node.dataset.targetAnchor=l.targetAnchor||'';if(node.tagName==='A')node.href=l.file;else{node.setAttribute('role','link');node.setAttribute('tabindex','0');node.style.cursor='pointer';node.addEventListener('keydown',e=>{if(e.key==='Enter')node.click()})}}}document.addEventListener('click',e=>{const el=e.target.closest('[data-nav]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();location.href=el.dataset.nav;},true);</script><script src="runtime.js"></script></body></html>
