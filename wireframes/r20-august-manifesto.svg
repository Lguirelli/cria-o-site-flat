<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"><title>Manifesto do coletivo</title><desc>Wireframe estrutural editável. Ícones funcionais são implementados com Material Symbols no HTML.</desc><rect x="0" y="0" width="1200" height="620" rx="0" fill="#fff" stroke="#a1a6b1"/><text x="32" y="35" font-size="16" fill="#252b35" font-family="Arial,sans-serif">Manifesto do coletivo</text><text x="90" y="90" font-size="34" fill="#252b35" font-family="Arial,sans-serif">Somos um coletivo criativo de produtores de eventos,</text><text x="90" y="130" font-size="34" fill="#252b35" font-family="Arial,sans-serif">especialistas em marketing, diretores de arte,</text><text x="90" y="170" font-size="34" fill="#252b35" font-family="Arial,sans-serif">designers e analistas de estratégia.</text><rect x="180" y="280" width="840" height="4" rx="1" fill="#bbc0c9" stroke="#a1a6b1"/><rect x="180" y="296" width="840" height="4" rx="1" fill="#bbc0c9" stroke="#a1a6b1"/><rect x="180" y="312" width="672.0" height="4" rx="1" fill="#bbc0c9" stroke="#a1a6b1"/><rect x="510" y="400" width="170" height="44" rx="22" fill="#d0c9e7" stroke="#a1a6b1"/><text x="526" y="428" font-size="16" fill="#252b35" font-family="Arial,sans-serif">Ação</text></svg>